<!doctype html>
<html><head><meta charset="utf-8"></head><body style="margin:0">
<script>
// Tiny Streamlit component: keeps the viewer's followed bills and last-visit
// time in this browser's localStorage. Nothing is sent to any server.
// Protocol: https://docs.streamlit.io/develop/concepts/custom-components
(function () {
  const KEY = "ndwatch.v1";
  let lastSent = null;
  function read() {
    try { return JSON.parse(window.localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; }
  }
  function write(obj) {
    try { window.localStorage.setItem(KEY, JSON.stringify(obj)); } catch (e) {}
  }
  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
  }
  window.addEventListener("message", function (event) {
    if (!event.data || event.data.type !== "streamlit:render") return;
    const args = event.data.args || {};
    let state = read();
    if (args.write && typeof args.write === "object") {
      state = Object.assign(state, args.write);
      write(state);
    }
    const out = JSON.stringify(state);
    if (out !== lastSent) {
      lastSent = out;
      send("streamlit:setComponentValue", { value: state, dataType: "json" });
    }
  });
  send("streamlit:componentReady", { apiVersion: 1 });
  send("streamlit:setFrameHeight", { height: 0 });
})();
</script>
</body></html>
