[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ndwatch"
version = "0.1.0"
description = "North Dakota LGBTQ+ Legislative Watch: monitors official ND legislative data and explains it in plain English."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pypdf>=4.0",
  "pyyaml>=6.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
app = ["streamlit>=1.40"]
dev = ["pytest>=8", "ruff>=0.5", "respx>=0.21"]

[project.scripts]
ndwatch = "ndwatch.cli:main"

[tool.setuptools.packages.find]
include = ["ndwatch*"]

[tool.setuptools.package-data]
ndwatch = ["relevance/*.yaml", "ui/*.css", "ui/storage_component/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "historical: tests that use real, archived 2025 legislative records",
  "network: tests that contact ndlegis.gov (skipped unless NDWATCH_NETWORK_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
