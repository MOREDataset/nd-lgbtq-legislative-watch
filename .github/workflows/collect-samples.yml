# Manually triggered. Downloads a small set of raw official files so parsers can
# be checked against the real formats. Results are uploaded as a build artifact
# (not committed), and reveal whether GitHub's runners can reach ndlegis.gov.
name: Collect source samples

on:
  # Also runs when the request file changes, so samples can be refreshed by a commit.
  push:
    branches: [main]
    paths: [".github/sample-request.txt"]
  workflow_dispatch:
    inputs:
      assemblies:
        description: "Comma-separated assemblies, e.g. 69-2025"
        default: "69-2025"
      extra_urls:
        description: "Extra URLs (space-separated)"
        default: ""

permissions:
  contents: write  # pushes the samples to the separate `source-samples` branch

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Download samples
        env:
          ASSEMBLIES: ${{ inputs.assemblies || '69-2025' }}
          EXTRA: ${{ inputs.extra_urls }}
        run: |
          args=""
          for a in ${ASSEMBLIES//,/ }; do args="$args --assembly $a"; done
          if [ -z "$EXTRA" ] && [ -f .github/sample-request.txt ]; then EXTRA=$(grep -v '^#' .github/sample-request.txt | tr '\n' ' '); fi
          for u in $EXTRA; do args="$args --url $u"; done
          for n in 1144 1430 1217; do
            for p in bill-overview/bo bill-actions/ba bill-hearings/bh bill-testimony/bt bill-index/bi; do
              args="$args --url https://ndlegis.gov/assembly/69-2025/regular/${p}${n}.html"
            done
          done
          args="$args --url https://ndlegis.gov/legend/chamber_calendar/view/?chamber=H"
          python -m ndwatch collect-samples samples $args || echo "::warning::some downloads failed (see manifest)"
          echo "--- century code size (headers only)"
          curl -sI -A "ND-LGBTQ-Legislative-Watch/0.1" https://ndlegis.gov/api/data/century_code.json | tee samples/century_code_headers.txt
      - name: Save samples to the source-samples branch (compressed, kept out of main)
        run: |
          trap 'echo "::error::save step failed at: $BASH_COMMAND"' ERR
          mkdir -p /tmp/out
          for f in samples/*; do
            case "$f" in *manifest.json|*headers.txt) cp "$f" /tmp/out/ ;; *) gzip -9 -c "$f" > "/tmp/out/$(basename "$f").gz" ;; esac
          done
          ls -la /tmp/out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan source-samples
          git rm -rqf .
          git clean -fdxq
          cp /tmp/out/* .
          find . -maxdepth 1 -type f -size +95M -print -delete
          git add -A
          git commit -qm "Source samples $(date -u +%Y-%m-%dT%H:%MZ)"
          if ! git push -f origin source-samples 2> push-err.txt; then
            echo "::error::push failed: $(tr '\n' ' ' < push-err.txt | head -c 1500)"
            exit 1
          fi
